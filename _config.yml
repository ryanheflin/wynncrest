url: "https://wynncrestbooks.com"
title: "Wynncrest Books"
description: "Independent publishing imprint of Heflin Media Group providing editorial preparation, book design, production, publishing, and distribution."

collections:
  articles:
    output: true
    permalink: /articles/:name/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article
      author: "Wynncrest Books Editorial Team"
      image: "/assets/images/wynncrest-books.png"

exclude:
  - README.md
